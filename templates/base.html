<!DOCTYPE html>

<html lang="en">

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
    {% block title %}CRM System{% endblock %}
</title>

<style>

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        font-family: Arial, sans-serif;
        background-color: #f4f6f9;
        color: #333;
    }

    /* Navigation bar */

    .navbar {
        background-color: #1f2937;
        padding: 15px 30px;

        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .navbar h2 {
        color: white;
    }

    .nav-links {
        display: flex;
        align-items: center;
        gap: 10px;
    }

    .nav-links a {
        color: white;
        text-decoration: none;
        padding: 8px 14px;
        border-radius: 5px;
    }

    .nav-links a:hover {
        background-color: #374151;
    }

    /* Logout */

    .logout-btn {
        background-color: #dc3545;
        color: white;

        border: none;
        padding: 8px 14px;

        border-radius: 5px;
        cursor: pointer;
    }

    .logout-btn:hover {
        background-color: #b02a37;
    }

    /* Main container */

    .container {
        width: 90%;
        max-width: 1200px;

        margin: 30px auto;
    }

    /* Page heading */

    .page-header {
        display: flex;
        justify-content: space-between;
        align-items: center;

        margin-bottom: 25px;
    }

    /* Cards */

    .card-container {
        display: flex;
        gap: 20px;

        margin: 20px 0 30px 0;
    }

    .card {
        background-color: white;

        padding: 20px;

        border-radius: 10px;

        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);

        flex: 1;
    }

    .card h3 {
        margin-bottom: 10px;
        color: #555;
    }

    .card p {
        font-size: 28px;
        font-weight: bold;
    }

    /* Buttons */

    .btn {
        display: inline-block;

        padding: 10px 16px;

        border-radius: 5px;

        text-decoration: none;

        border: none;

        cursor: pointer;

        font-size: 14px;
    }

    .btn-primary {
        background-color: #007bff;
        color: white;
    }

    .btn-primary:hover {
        background-color: #0056b3;
    }

    .btn-success {
        background-color: #198754;
        color: white;
    }

    .btn-success:hover {
        background-color: #146c43;
    }

    /* Tables */

    .table-container {
        background-color: white;

        padding: 20px;

        border-radius: 10px;

        margin-top: 15px;
        margin-bottom: 30px;

        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);

        overflow-x: auto;
    }

    table {
        width: 100%;

        border-collapse: collapse;
    }

    th {
        background-color: #1f2937;

        color: white;

        padding: 12px;

        text-align: left;
    }

    td {
        padding: 12px;

        border-bottom: 1px solid #ddd;
    }

    tr:hover {
        background-color: #f8f9fa;
    }

    /* Employee profile */

    .profile-card {
        background-color: white;

        padding: 20px;

        border-radius: 10px;

        margin-top: 20px;

        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }

    .profile-card p {
        margin: 10px 0;
    }

    /* Action buttons */

    .actions {
        display: flex;

        gap: 10px;

        flex-wrap: wrap;

        margin: 20px 0;
    }

    /* Mobile */

    @media (max-width: 768px) {

        .navbar {
            flex-direction: column;
            gap: 15px;
        }

        .card-container {
            flex-direction: column;
        }

        .container {
            width: 95%;
        }

    }

</style>


</head>

<body>


<!-- Navigation -->

<nav class="navbar">

    <h2>CRM System</h2>

    <div class="nav-links">

        {% if request.user.is_authenticated %}
            <form method="POST"
                  action="{% url 'logout' %}"
                  style="display: inline;">

                {% csrf_token %}

                <button type="submit" class="logout-btn">
                    Logout
                </button>

            </form>

        {% endif %}

    </div>

</nav>


<!-- Main content -->

<main class="container">

    {% block content %}
    {% endblock %}

</main>

</body>

</html>
