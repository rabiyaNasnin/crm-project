<!DOCTYPE html>

<html lang="en">

<head>


<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CRM Sign In</title>

<style>

    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;

        font-family: Arial, sans-serif;

        background: #f4f6f9;

        min-height: 100vh;

        display: flex;
        justify-content: center;
        align-items: center;
    }


    /* Login box */

    .login-container {

        width: 400px;

        max-width: 90%;

        background: white;

        padding: 40px;

        border-radius: 12px;

        box-shadow: 0 5px 20px rgba(0, 0, 0, 0.12);
    }


    /* Logo / title */

    .logo {

        text-align: center;

        margin-bottom: 5px;

        color: #1f2937;

        font-size: 30px;
    }


    .subtitle {

        text-align: center;

        color: #6b7280;

        margin-bottom: 30px;

        font-size: 14px;
    }


    /* Error message */

    .error {

        background-color: #f8d7da;

        color: #842029;

        padding: 10px;

        border-radius: 5px;

        margin-bottom: 20px;

        text-align: center;

        font-size: 14px;
    }


    /* Labels */

    label {

        display: block;

        margin-bottom: 7px;

        font-weight: bold;

        color: #374151;
    }


    /* Inputs */

    input {

        width: 100%;

        padding: 12px;

        margin-bottom: 20px;

        border: 1px solid #d1d5db;

        border-radius: 6px;

        font-size: 14px;

        outline: none;
    }


    input:focus {

        border-color: #007bff;

        box-shadow: 0 0 0 2px rgba(0, 123, 255, 0.1);
    }


    /* Login button */

    .login-btn {

        width: 100%;

        padding: 12px;

        border: none;

        border-radius: 6px;

        background-color: #007bff;

        color: white;

        font-size: 16px;

        font-weight: bold;

        cursor: pointer;
    }


    .login-btn:hover {

        background-color: #0056b3;
    }


    /* Footer */

    .login-footer {

        text-align: center;

        margin-top: 25px;

        color: #888;

        font-size: 12px;
    }


    /* Mobile */

    @media (max-width: 500px) {

        .login-container {

            padding: 30px 25px;
        }

        .logo {

            font-size: 26px;
        }

    }

</style>


</head>

<body>

<div class="login-container">


    <h1 class="logo">
        CRM System
    </h1>


    <p class="subtitle">
        Sign in with your account
    </p>


    {% if error %}

        <p class="error">
            {{ error }}
        </p>

    {% endif %}


    <form method="POST">

        {% csrf_token %}


        <label for="user_id">
            User ID
        </label>

        <input
            type="text"
            id="user_id"
            name="user_id"
            placeholder="Enter your user ID"
            required
        >


        <label for="password">
            Password
        </label>

        <input
            type="password"
            id="password"
            name="password"
            placeholder="Enter your password"
            required
        >


        <button
            type="submit"
            class="login-btn">
            Login
        </button>

    </form>


    <div class="login-footer">
        CRM System
    </div>


</div>


</body>

</html>
