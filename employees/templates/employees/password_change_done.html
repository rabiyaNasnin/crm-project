{% extends "base.html" %}

{% block title %}Password Updated{% endblock %}

{% block content %}
<style>
    .password-done-card {
        max-width: 560px;
        margin: 40px auto;
    }

    .password-done-card h1 {
        margin-bottom: 10px;
        color: #1f2937;
    }

    .password-done-card p {
        margin-bottom: 24px;
        color: #6b7280;
        font-size: 15px;
        font-weight: normal;
        line-height: 1.5;
    }
</style>

<section class="card password-done-card">
    <h1>Password updated</h1>
    <p>Your password has been changed successfully.</p>
    <a href="{% url 'home' %}" class="btn btn-primary">Return to dashboard</a>
</section>
{% endblock %}
