{% extends "base.html" %}

{% block title %}Update Password{% endblock %}

{% block content %}
<style>
    .password-card {
        max-width: 560px;
        margin: 40px auto;
    }

    .password-card h1 {
        margin-bottom: 10px;
        color: #1f2937;
    }

    .password-card > p {
        margin-bottom: 24px;
        color: #6b7280;
        font-size: 15px;
        font-weight: normal;
        line-height: 1.5;
    }

    .password-card form p {
        margin-bottom: 18px;
        font-size: 14px;
        font-weight: normal;
    }

    .password-card label {
        display: block;
        margin-bottom: 7px;
        color: #374151;
        font-weight: bold;
    }

    .password-card input {
        width: 100%;
        padding: 11px 12px;
        border: 1px solid #d1d5db;
        border-radius: 6px;
        font-size: 15px;
    }

    .password-card input:focus {
        outline: none;
        border-color: #007bff;
        box-shadow: 0 0 0 3px rgba(0, 123, 255, 0.12);
    }

    .password-card .helptext,
    .password-card ul {
        display: block;
        margin: 7px 0 0;
        color: #6b7280;
        font-size: 13px;
        font-weight: normal;
        line-height: 1.5;
    }

    .password-card ul {
        padding-left: 20px;
    }

    .password-card .errorlist {
        color: #b91c1c;
    }

    .password-card button {
        width: 100%;
        margin-top: 4px;
    }

    @media (max-width: 600px) {
        .password-card {
            margin: 20px auto;
        }
    }
</style>

<section class="card password-card">
    <h1>Update password</h1>
    <p>Enter your current password, then choose a new one.</p>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Save new password</button>
    </form>
</section>
{% endblock %}
