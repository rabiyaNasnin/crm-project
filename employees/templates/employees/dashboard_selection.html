<!DOCTYPE html>
<html>
<head>
    <title>Select Dashboard</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            color: #333;
        }

        .container {
            width: 90%;
            max-width: 700px;
            margin: 80px auto;
            text-align: center;
        }

        .card {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
        }

        h1 {
            margin-top: 0;
            color: #1f2937;
        }

        .subtitle {
            color: #6b7280;
            margin-bottom: 30px;
        }

        .dashboard-btn {
            display: block;
            width: 100%;
            padding: 15px;
            margin: 15px 0;
            border-radius: 7px;
            text-decoration: none;
            color: white;
            font-weight: bold;
            font-size: 16px;
            background: #2563eb;
        }

        .dashboard-btn:hover {
            background: #1d4ed8;
        }

        .logout-btn {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            background: #dc3545;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
            border: none;
            cursor: pointer;
            font-size: 14px;
        }

        .logout-btn:hover {
            background: #b02a37;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="card">

        <h1>Select Dashboard</h1>

        <p class="subtitle">
            Choose the dashboard you want to access.
        </p>
        <a href="{% url 'admin_login' %}" class="dashboard-btn">Admin</a>

        <a href="{% url 'employee_login' %}" class="dashboard-btn">Employee</a>

        <a href="{% url 'hr_login' %}" class="dashboard-btn">HR</a>
        
        <form method="POST" action="{% url 'company_logout' %}">
            {% csrf_token %}
            <button type="submit" class="logout-btn">
                Logout
            </button>
        </form>
    </div>

</div>

</body>
</html>
